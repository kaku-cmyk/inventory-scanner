<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JANリアルタイムスキャン</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#fff;font-family:Meiryo,"メイリオ",sans-serif}header{background:#203b62;padding:18px 16px}h1{font-size:20px;margin:0}.subtitle{font-size:12px;color:#d6e1ef;margin-top:5px}main{max-width:600px;margin:auto;padding:16px}.guide{text-align:center;line-height:1.7;margin-bottom:14px}#reader{background:#000;border-radius:12px;overflow:hidden;width:100%}#reader video{width:100%!important}.status{background:#1e2938;border-radius:9px;text-align:center;padding:13px;margin-top:15px;line-height:1.6;font-size:14px}.status.success{background:#126a45}.status.error{background:#7a2828}.detected{background:#203047;border:2px solid #48bf8c;border-radius:12px;text-align:center;margin-top:15px;padding:18px 10px}.detected[hidden],button[hidden]{display:none!important}.detected-number{font-size:clamp(20px,6vw,30px);font-weight:bold;letter-spacing:1px;overflow-wrap:anywhere;margin:10px 0}.actions{display:grid;gap:10px;margin-top:18px}button{width:100%;border:0;border-radius:9px;padding:15px;font:700 15px Meiryo,"メイリオ",sans-serif;cursor:pointer}button:disabled{opacity:.5}.search{background:#23a36f;color:#fff;position:relative;z-index:20;pointer-events:auto!important;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.2)}.retry{background:#e8edf4;color:#263449}.back{background:#24588f;color:#fff}.help{color:#aeb9c7;font-size:12px;line-height:1.8;margin-top:18px}
</style>
</head>
<body>
<header><h1>JANリアルタイムスキャン</h1><div class="subtitle">JAN-13 / EAN-13専用</div></header>
<main>
<div class="guide">商品のバーコードを<br>カメラの枠内に合わせてください</div>
<div id="reader"></div>
<div id="status" class="status">カメラを起動しています...</div>
<div id="detected" class="detected" hidden>
<div>読み取りJAN（13桁）</div><div id="detectedNumber" class="detected-number"></div>
<div style="font-size:13px;line-height:1.7">商品の印字数字と一致するか確認してください。</div>
</div>
<div class="actions">
<button id="searchButton" class="search" type="button" hidden>このJANで在庫検索</button>
<button id="retryButton" class="retry" type="button" hidden>再スキャン</button>
<button id="backButton" class="back" type="button">在庫検索へ戻る（キャンセル）</button>
</div>
<div class="help">読み取りのコツ<br>・左右の白い余白まで映してください。<br>・バーコードを水平にし、反射を避けてください。<br>・誤読した場合は「再スキャン」を押してください。</div>
</main>
<script>
'use strict';
const GAS_SEARCH_URL='https://script.google.com/a/macros/hiroshimaya.jp/s/AKfycbzn1glB1-0aGMAmwULAMYz2VMCNflNrcE-lwsL3ZwAbf88N20_nX0xnNU7uMZRJkEI/exec';
const REQUIRED_READS=3;
const MAX_READ_INTERVAL=2500;
let scanner=null, starting=false, confirmed=false, selectedJan='', candidate='', hits=0, lastRead=0, session=0;
let sending=false;
let lastSendAttempt=0;
let sentToInventory=false;
const statusBox=document.getElementById('status');
const detectedBox=document.getElementById('detected');
const detectedNumber=document.getElementById('detectedNumber');
const searchButton=document.getElementById('searchButton');
const retryButton=document.getElementById('retryButton');
const backButton=document.getElementById('backButton');
function setStatus(message,type=''){statusBox.textContent=message;statusBox.className='status'+(type?' '+type:'');}
function validJan13(code){
 if(!/^\d{13}$/.test(code))return false;
 let sum=0;
 for(let i=0;i<12;i++)sum+=Number(code[i])*(i%2===0?1:3);
 return (10-sum%10)%10===Number(code[12]);
}
function resetHits(){candidate='';hits=0;lastRead=0;}
async function stopScanner(){if(scanner&&scanner.isScanning){try{await scanner.stop();}catch(e){console.warn(e);}}}
async function clearScanner(){await stopScanner();if(scanner){try{await scanner.clear();}catch(e){console.warn(e);}}scanner=null;}
function readBarcode(raw,ownSession){
 if(confirmed||ownSession!==session)return;
 const jan=String(raw||'').trim();
 if(!validJan13(jan))return;
 const now=Date.now();
 if(candidate===jan&&now-lastRead<=MAX_READ_INTERVAL)hits++;else{candidate=jan;hits=1;}
 lastRead=now;
 if(hits<REQUIRED_READS){setStatus('JAN候補を確認中：'+hits+' / '+REQUIRED_READS+'回');return;}
 confirmed=true;selectedJan=jan;
 sending=false;sentToInventory=false;searchButton.disabled=false;
 detectedNumber.textContent=jan;detectedBox.hidden=false;searchButton.hidden=false;retryButton.hidden=false;
 setStatus('3回読み取りました。印字数字を確認してください。','success');
 stopScanner();
}
async function startScanner(){
 if(starting||confirmed)return;
 starting=true;const ownSession=++session;resetHits();
 sending=false;sentToInventory=false;selectedJan='';
 searchButton.disabled=false;searchButton.textContent='このJANで在庫検索';
 detectedBox.hidden=true;searchButton.hidden=true;retryButton.hidden=true;
 setStatus('背面カメラを起動しています...');
 try{
  if(typeof Html5Qrcode==='undefined')throw new Error('読み取りライブラリを読み込めません');
  scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],verbose:false});
  // JANコード用の横長ガイド。小さい画面では自動的に縮小する。
  const cameraConfig={
    fps:10,
    qrbox:(viewWidth,viewHeight)=>{
      const width=Math.max(100,Math.min(340,viewWidth-24));
      const height=Math.min(125,Math.max(65,viewHeight-24),Math.round(width*0.38));
      return {width:Math.round(width),height:Math.round(height)};
    }
  };
  await scanner.start({facingMode:'environment'},cameraConfig,text=>readBarcode(text,ownSession),()=>{});
  if(ownSession!==session){await stopScanner();return;}
  if(!confirmed)setStatus('JAN-13を読み取り中です。バーコードを枠内に合わせてください。');
 }catch(error){
  console.error(error);
  setStatus('カメラ起動エラー：'+(error&&error.message?error.message:String(error))+'。ブラウザのカメラ権限も確認してください。','error');
  retryButton.hidden=false;
 }finally{starting=false;}
}
retryButton.addEventListener('click',async()=>{
 retryButton.disabled=true;session++;confirmed=false;selectedJan='';
 sending=false;sentToInventory=false;searchButton.disabled=false;searchButton.textContent='このJANで在庫検索';
 await clearScanner();starting=false;retryButton.disabled=false;
 startScanner();
});
// 開いた元タブへJANを送信。受信確認が届いた場合だけ自動終了を試みる。
function sendToOpener(jan){
 return new Promise(resolve=>{
  if(!window.opener||window.opener.closed){resolve(false);return;}
  let finished=false;
  const done=ok=>{if(finished)return;finished=true;window.removeEventListener('message',onAck);clearTimeout(timeout);resolve(ok);};
  const onAck=event=>{
   if(event.source!==window.opener)return;
   const data=event.data;
   if(data&&data.type==='INVENTORY_SCANNER_ACK'&&data.jan===jan)done(true);
  };
  window.addEventListener('message',onAck);
  const timeout=setTimeout(()=>done(false),1200);
  try{window.opener.postMessage({type:'INVENTORY_SCANNER_JAN',jan},'*');}catch(e){done(false);}
 });
}
// Android Chromeで再利用タブのclickが届かないケースにも対応する。
// ボタンをdisabledにせず、連打防止はJSのフラグで行う。
async function submitJan(){
 const now=Date.now();
 if(sending || now-lastSendAttempt<650)return;
 lastSendAttempt=now;
 const jan=selectedJan || detectedNumber.textContent.trim();
 if(!validJan13(jan)){
  setStatus('JANを確認できません。再スキャンしてください。','error');
  return;
 }
 sending=true;
 searchButton.disabled=false;
 searchButton.textContent='送信中...';
 setStatus('在庫検索画面へJANを送信しています...');
 try{
  const ok=await sendToOpener(jan);
  if(ok){
   sentToInventory=true;
   setStatus('JANを送信しました。在庫検索タブをご確認ください。','success');
   await stopScanner();
   try{window.opener.focus();}catch(e){}
   searchButton.hidden=true;
   retryButton.hidden=false;
  }else{
   setStatus('在庫検索画面を開いています...');
   window.location.assign(GAS_SEARCH_URL+'?jan='+encodeURIComponent(jan));
  }
 }catch(error){
  console.error('JAN送信エラー:',error);
  setStatus('送信エラー：'+(error.message||String(error)),'error');
 }finally{
  sending=false;
  searchButton.disabled=false;
  searchButton.textContent='このJANで在庫検索';
 }
}
searchButton.addEventListener('click',submitJan);
// タッチ端末ではclickイベントが欠落する場合に備え、touchendでも直接送信する。
// touchendのデフォルトclickを抑止して二重送信を防ぐ。
searchButton.addEventListener('touchend',function(event){
 if(searchButton.hidden)return;
 event.preventDefault();
 submitJan();
},{passive:false});
// タブがバックグラウンドから復帰した際のボタン状態を復旧する。
function restoreButtonState(){
 if(sending)return;
 searchButton.disabled=false;
 searchButton.textContent='このJANで在庫検索';
 if(confirmed&&validJan13(selectedJan)&&!sentToInventory){
  searchButton.hidden=false;
 }
}
window.addEventListener('pageshow',restoreButtonState);
window.addEventListener('focus',restoreButtonState);
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden)restoreButtonState();
});
backButton.addEventListener('click',async()=>{
 await stopScanner();
 if(window.opener&&!window.opener.closed){
  setStatus('元の在庫検索タブに戻ってください。スキャナータブは次回も再利用できます。','success');
  try { window.opener.focus(); } catch(e) {}
  return;
 }
 // 直接開いた場合は、元タブがないため通常の在庫検索URLへ戻る
 window.location.replace(GAS_SEARCH_URL);
});
window.addEventListener('load',startScanner);
</script>
</body>
</html>
